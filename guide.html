<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';" />
<title>使い方</title>
<style>
  :root {
    --bg: #17181c;
    --panel: #1f2126;
    --panel-alt: #26282e;
    --border: #33353c;
    --text: #f2f2f4;
    --text-muted: #9b9ea6;
    --accent: #6c8bff;
    --accent-contrast: #10121a;
    --danger: #ff6b5e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    overflow: hidden;
  }
  .frame { display: flex; flex-direction: column; height: 100%; border: 1px solid var(--border); overflow: hidden; }
  .title-bar {
    -webkit-app-region: drag;
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 8px 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .title-bar .label { font-size: 12px; color: var(--text-muted); letter-spacing: 1px; }
  .title-bar .btns { display: flex; gap: 6px; -webkit-app-region: no-drag; }
  .icon-btn {
    width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--panel-alt); color: var(--text-muted); font-size: 13px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .icon-btn.active { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  .icon-btn:hover { color: var(--text); }
  .icon-btn.close-btn:hover { background: var(--danger); border-color: var(--danger); color: #fff; }

  .body {
    flex: 1; overflow-y: auto; padding: 16px 18px 20px;
  }
  .body::-webkit-scrollbar { width: 8px; }
  .body::-webkit-scrollbar-thumb { background: var(--panel-alt); border-radius: 4px; }
  .guide-line {
    font-size: 13px; line-height: 1.7; color: var(--text); margin-bottom: 14px;
  }
  .guide-copy { margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--border); text-align: center; font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="frame">
    <div class="title-bar">
      <span class="label">📖 使い方</span>
      <div class="btns">
        <div class="icon-btn" id="lockBtn" title="常に最前面に表示">🔓</div>
        <div class="icon-btn close-btn" id="closeBtn" title="閉じる">✕</div>
      </div>
    </div>
    <div class="body" id="bodyEl"></div>
  </div>

<script>
  // ハンバーガーメニューにあった「使い方」の内容をそのまま表示する。
  // 内容を増やす場合は、ここに1行ずつ追加すればよい。
  const GUIDE_LINES = [
    "🖥 対応OS：このアプリは現在Windowsのみに対応しています。",
    "📄 画面：アイコンが増えすぎたときに、独立した画面を分けて整理できます。切替・追加・削除はハンバーガーメニュー最上部の「画面切替」から行えます。バックアップは、全体（すべてのLaunch-K画面）と「いま開いている画面だけ」を別々に書き出し・読み込みできます。削除は好きな画面を選べて（確認あり）、後ろの画面は番号が繰り上がります（例：画面1〜3の2を削除すると、旧3が2になります）。行数・列数、アイコンの大きさ、ボタン間の距離0、影、アイコンの周りの囲み線、アイコンボタン裏の枠の透明度、ツールチップの表示、タイトル（Launch-K）の表示、テーマ、アクセントカラーは、画面ごとに独立して設定できます。画面を追加するときは、「初期設定」または「既存の画面と同じ設定」から選べます（同じ設定にするのは登録したボタン以外のすべてで、ボタン自体はコピーされません）。起動用ショートカットは、別の画面のボタンを含めて重複して設定できません（詳しくは「ショートカットキーの重複」）。",
    "💾 バックアップの範囲：「全体（すべてのLaunch-K画面）」はすべての画面のボタンと画面ごとの設定をまとめて書き出し・読み込みします。「画面だけ」はいま開いている1画面分のボタンと画面ごとの設定（レイアウト・表示・テーマなど）のみが対象です。「Windows起動時に自動起動」は画面ごとではなく全画面共通の設定のため、どちらのバックアップにも含まれません。別の環境に移すときは、これだけ手動で設定し直してください。",
    "🔀 Launch-K画面切り替え：ボタンの種類「Launch-K画面切り替え」は、Launch-Kの中の別の画面（ページ）を開くためのボタンです。押すと選んだ画面が別ウィンドウとして開きます（すでに開いていれば前面に表示するだけです）。ウィンドウを画面の半分・四隅に配置する「画面分割」とは別の機能なので混同しないようご注意ください。",
    "🔘 ボタンの種類の選び方：種類の候補が増えてきたため、ボタン追加・編集画面の「種類」欄はタップすると一覧のダイアログが開き、そこから選ぶ形式になっています（マルチ操作の各動作の「種類」も同様です）。今選択中の種類にはチェックが付きます。",
    "📐 行数・列数：両方「自動」のときは画面幅に合わせて数が変わります。どちらかを固定すると、その数を保ったままアイコンの大きさが自動で伸縮します（アイコンサイズは常に一番低い優先度で自動調整されます）。メイン画面はスクロールせず、行列が途切れない大きさ（アイコン30px相当）より小さくはウィンドウを縮められません。行列を増やして足りなくなったときは、ウィンドウが自動で広がります。行数・列数を両方固定しているときは、実際に使っている行（ボタン数＋追加ボタン）ぶんの高さまでウィンドウの底辺を詰められ、ボタンを増やして使う行が増えたときは、アイコンの大きさを保ったまま1行ぶん下へ広がります（減らしたときは自動では縮みません）。",
    "💾 プリセット：行数・列数を固定した状態を名前つきで保存し、あとでワンクリックでその形に戻せます。適用時のウィンドウは、PC画面の作業領域のおよそ9%の広さになります。",
    "📏 ボタン間の距離0：ハンバーガーメニュー「ボタンの見た目」でオンにすると、ボタン同士の上下左右の間隔が0になります（画面ごとの設定）。オンの間は、枠線とボタンの影が表示上だけ自動で消えます。チェックを外すと、もとの見た目にそのまま戻ります。",
    "💬 ツールチップ：ボタンにマウスを乗せると名前とショートカットキーが表示されます。ボタンの下には名前などを表示しなくなりました。ハンバーガーメニュー「ボタンの見た目」で、画面ごとに表示のオン・オフを切り替えられます。",
    "🪟 ウィンドウの移動と大きさ：画面上部の操作列（◀▶・🔒・☰がある行）の空いている部分をドラッグすると、ウィンドウを移動できます（ダブルクリックで最大化）。縦長などで右上のボタンと重なりそうなときは、サブページの「1 / 2」の文字だけが自動で消え、◀▶は残ります。起動時はPC画面の作業領域のおよそ9%の広さで開きます。",
    "✏️ 編集・削除ボタン：ウィンドウがとても小さいとき（PC画面の作業領域の1/12以下、またはボタンが約36px以下）は、誤操作を防ぐため、ボタンの編集・削除ボタンは表示されません。ウィンドウを広げると使えます。",
    "🎨 アイコン：ボタン編集の「既定」は種類・動作に応じて自動でアイコンが選ばれるモード、「CSS」は用意した一覧から選ぶモード、「絵文字」は1文字入力、「画像」は画像ファイルを選ぶか、「画面を撮る」を押して画面をドラッグで範囲選択するモードです。「画面を撮る」ではアプリが一瞬隠れ、選んだ正方形の範囲がそのままアイコンになります（Enterで画面全体、Escでキャンセル）。設定の「画像背景」でも、ファイル選択と画面キャプチャのどちらも使えます。",
    "🎵 サウンド：選んだ音声ファイル（mp3・wav・ogg・m4a）をワンタップで再生するボタンです。効果音・通知音・ボイスメモなどを鳴らすのに使えます。",
    "📋 コピー：クリップボードにコピーする内容として、テキスト・画像に加えて、指定したファイルまたはフォルダそのものを選べます。ファイル／フォルダを選ぶと、押したときにそのファイル・フォルダ自体がコピーされ、Explorerなどに貼り付けると実際のファイルコピーになります（Windowsのみ対応）。「直前まで使っていた入力欄にそのまま貼り付ける」を合わせて使うと、ファイル・フォルダの場合はコピー直後にExplorerへの貼り付け（Ctrl+V相当）まで自動で行えます。",
    "📝 メモ：アプリで起動先にWindows標準の「メモ」（notepad.exe）を選ぶと、「既存のウィンドウを開く（前面に出すだけ）」「既存のウィンドウに追加（新しいタブ）」「新規のウィンドウ」を選べます。まだメモが開いていない場合は、どれを選んでも新しく起動します。",
    "💬 Discord：このアプリから直接Discordは操作できないため、Discord側のキーボードショートカット設定と同じキーをボタン側にも登録し、そのキーを送信することでミュート切替などを行います。送信するキー（送信用）は、Launch-K自身の起動用ショートカットと同じにはできません。送信用どうしは、同じキーでも設定できます。",
    "🧩 マルチ操作：登録した複数の動作（マルチ操作以外）を、上から順に実行するボタンです。動作の間の待ちは状況に応じて自動で最短になり、各動作の「このあとの待ち」で0〜2秒に変えることもできます。同時には実行されません。動作は2〜15個まで登録でき、並び替えはドラッグ、削除は✕から行えます。「アプリやリンクを開く→画面分割」と続けると、開いた直後の新しいウィンドウを自動で見つけて配置します（最大7秒待ちます）。動作の欄でEnterを押しても保存されないので、続けて入力できます。",
    "🌐 リンク：URLを開く際のブラウザを、既定のほかChrome・Edgeから選べます。マルチ操作で「リンクを開く→画面分割」と続ける場合は、既存のウィンドウのタブにせず、普通のブラウザウィンドウ（タブ・アドレスバーつき）を新しく開くので、複数のウィンドウをそれぞれ別の位置に分けられます。単発でリンクだけを開くときは、これまで通り開きます。",
    "🪟 画面分割：使っていたウィンドウを、画面の左右の半分や四隅に配置するボタンです。うまく配置できないウィンドウ（管理者権限のアプリなど）は、Windows標準のキー操作（Win＋矢印）で代わりに試します。",
    "🔇 ミュートの表示：スピーカー・マイクのミュート切替ボタンは、Windowsの実際のミュート状態を読み取って表示します。もともとミュートだった場合や、キーボード・他のアプリ・Windowsの設定で切り替えた場合も、アイコンが実際の状態と合います（押した直後、画面に戻ったとき、画面が見えている間は5秒ごとに読み直します）。",
    "⌨️ ショートカット：コピー（Ctrl+C）・切り取り（Ctrl+X）・貼り付け（Ctrl+V）・元に戻す（Ctrl+Z）・やり直し（Ctrl+Y）・すべて選択（Ctrl+A）・保存（Ctrl+S）・検索（Ctrl+F）といった基本的なショートカットを、ボタン1つで送れます。押すと、直前まで使っていたウィンドウに対してそのキー操作を行います。自由なキーの登録はできず、用意された組み合わせから選ぶ方式です。このほか、ブラウザのタブを閉じる（Ctrl+W）と、閉じたタブを復元（Ctrl+Shift+T）も選べます。この2つは、前面のウィンドウがブラウザ（Chrome・Edge・Firefox・Brave・Vivaldi・Operaなど）のときだけ送られ、それ以外のウィンドウでは、エクスプローラーや文書が誤って閉じないよう、送らずにお知らせします。",
    "🔑 ショートカットキーの重複：起動用ショートカット（ボタンに登録して、どこからでも押せるキー）は、別の画面のボタンを含めて、同じキーを2か所に設定できません。「Discord等へキー送信」の送信用のキーとも、同じにはできません（送ったキーをLaunch-K自身が受け取ってしまうため）。送信用どうしは同じキーでも構いません（同じ操作のボタンを別の画面にも置く、マルチ操作で同じキーを2回送る、など）。設定のときに重複していると、どの画面のどのボタンが使っているかがお知らせされます。バックアップの読み込みで重なった起動用ショートカットは、未設定になります。",
    "⌨️ ショートカットの管理：ハンバーガーメニュー「Windows起動時に自動起動」の下の「ショートカットの管理」を押すと、別ウィンドウで一覧を見られます。「画面順」は画面1〜6ごとに、ボタン名と登録したキーを表示します（「未設定のボタンも表示」で全ボタンも確認できます）。「キー順」は数字、英字の順に、どの画面のどのボタンが使っているかを表示します。見るだけの画面で、変更はボタンの編集画面で行います。",
    "⏎ Enterキー：ボタンの追加・編集画面は、Enterで保存できます（複数行の入力欄とマルチ操作の動作欄を除く）。「適用する」などの確認画面は、そのままEnterで決定できます。削除・初期化・電源操作など取り消せない操作の確認画面は、うっかり実行しないよう、Enterを押すと「キャンセル」になります（実行するときはTabキーで赤いボタンに移ってEnter、またはクリック）。設定メニューでは、チェック項目にフォーカスがあるときのEnterで切り替え、プリセット名の入力欄でEnterを押すと保存します。",
    "🔄 更新：起動の少しあとと6時間ごとに新しいバージョンを確認し、見つかると裏でダウンロードします。「今すぐ再起動して更新」を選ぶと、Launch-Kを完全に終了してから、更新用インストーラーの画面が表示されます。表示されたら案内に沿って進めてください。「あとで」を選んだ場合は、Launch-Kを終了したときに更新されます。更新の経過はログに残り、うまくいかないときは、ハンバーガーメニュー最下部の「更新ログを開く」から確認できます。更新を開始できなかったときは、もとのバージョンで自動的に再起動します。",
    "📷 全画面スクショ：押すと画面全体を撮影し、ピクチャフォルダの「Launch-K Screenshots」にPNG画像として保存します。撮影中はLaunch-Kの画面は自動で隠れます。",
    "📱 Launch-0（スマホから操作）：ハンバーガーメニューの一番下の「Launch-0」、または 0 と K の同時押し（Launch-Kの画面が前面にあるとき。半角・全角・大文字でも、テンキーの0でも可）で開きます。開くと、画面1〜・タイマー・使い方などはすべて閉じ、PCで開いているのはLaunch-0だけになります（ボタンの編集やショートカットキーも使えません）。スマホで最初に表示する画面を選び、「QRを表示」→スマホでQRを読み取り→PCに表示された6文字のパスワードをスマホに入力→PCで端末を確認して「許可」を押すと接続されます。接続できるのは1台までです。終わったら、PCの「切断」か、スマホのメニュー（☰）の「接続を切断」で終了します。終了するとLaunch-0は閉じて、画面1に戻ります。",
    "🔒 Launch-0の接続方法：「Tailscale」（おすすめ）と「同じWi-Fi」から選べます。Tailscaleは、PCとiPhoneに無料のTailscaleアプリを入れて、同じアカウントでログインしておく方法です。通信が暗号化され、外出先や、Wi-Fiが違う場所でも使えます。PCのTailscale用の番号でだけ待ち受け、PCと同じアカウントの端末だけが接続できます（使っている間は、iPhoneのTailscaleをオンにしてください）。接続の経路は「direct（直接）」か「relay（中継サーバー経由）」で表示されます。「同じWi-Fi」は通信が暗号化されないので、自宅など自分しかいないWi-Fiでだけ使い、公共のWi-Fiでは使わないでください。",
    "🛡 Launch-0の安全のしくみ：QRとパスワードは30秒ごとに新しくなります（切り替え直後だけ、直前の分も30秒有効）。パスワードを合計3回間違えると、QRごと作り直されます。QRを表示して90秒たっても誰も接続しなければ、Launch-0は自動で閉じて画面1に戻ります。PCで「許可」を押さないと操作できません。接続後も、通信が25秒途切れると警告、75秒で切断、30分操作がないと切断（1分前に警告。「このまま続ける」で延長）、接続から3時間で切断、スマホの画面を5分以上閉じていると切断、PCのスリープ・画面ロック・ネットワークの変更でも切断されます。",
    "⏳ 操作の実行中：スマホから押した操作が終わるまでは、PCからもスマホからも切断できず、Launch-0も閉じません（通信の途切れなど、こちらで止められない切断のときは、接続は切れますが、実行中の操作が終わってからLaunch-0を閉じます）。マルチ操作の実行中は、そのマルチ操作が終わるまで、ほかのボタンは押せません（スマホでは薄く表示されます）。マルチ操作や画面分割の実行中だけ、Launch-0は一時的に最小化され、終わると元に戻ります。",
    "🚫 スマホから使えないボタン：Launch-Kの画面を開く操作（画面切り替え・タイマー・QR）と、電源操作は、スマホからは実行できません。これらを含むマルチ操作も使えません（スマホでは薄く表示され、押しても何も起きません）。",
    "👆 スマホでの操作：ボタンをタップすると実行されます。0.75秒以上押し続ける（長押し）と、ボタンの名前が表示されます（実行はされません）。長押しの途中で指を動かすと取り消されます。ボタンが18個を超えると、画面上部の「◀ 1 / 2 ▶」でサブページを切り替えます（縦画面は3列×6行、横画面は6列×3行）。ほかの画面への切り替えは、左上の☰から行います。背景の色は、PCの画面のテーマの色を引き継ぎます（画像の背景は引き継がず、暗い単色になります）。",
    "🧰 Launch-0がつながらないとき：Tailscaleの場合は、PCとiPhoneの両方でTailscaleがオンで、同じアカウントでログインしているか確認してください（PC側の状態はLaunch-0の画面に表示されます）。スマホから届かないときは、Launch-0の画面の「許可を追加」（Windowsファイアウォール。管理者の確認が出ます）を試してください。「同じWi-Fi」の場合は、大学や公共のWi-Fiでは端末同士の通信が止められていて、つながらないことがあります。通信が途切れて切断されたときは、スマホにも理由が表示されます。iPhone以外の端末（Androidなど）は動作の確認をしていないため、PCの許可画面に「動作の確認をしていません」と表示されます。",
    "🖱️ 多重起動：デスクトップのアイコンを何度押しても、新しいウィンドウは増えず、すでに開いているLaunch-Kが前面に出ます（Launch-0を開いている間は、Launch-0が前面に出ます）。",
  ];
  const bodyEl = document.getElementById("bodyEl");
  bodyEl.innerHTML = GUIDE_LINES.map((line) => `<div class="guide-line">${line}</div>`).join("") + `<div class="guide-copy">© kaseki</div>`;

  const lockBtn = document.getElementById("lockBtn");
  const closeBtn = document.getElementById("closeBtn");
  // メインウィンドウのロックボタンと同じ仕様：既定はオフ（🔓）、押すたびにオン/オフを切り替える。
  let locked = false;
  lockBtn.addEventListener("click", () => {
    locked = !locked;
    lockBtn.classList.toggle("active", locked);
    lockBtn.textContent = locked ? "🔒" : "🔓";
    window.guideApi.setAlwaysOnTop(locked);
  });
  closeBtn.addEventListener("click", () => window.guideApi.close());
</script>
</body>
</html>

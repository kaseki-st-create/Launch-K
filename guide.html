<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';" />
<title>使い方</title>
<style>
  :root {
    --bg: #17181c;
    --panel: #1f2126;
    --panel-alt: #26282e;
    --border: #33353c;
    --text: #f2f2f4;
    --text-muted: #9b9ea6;
    --accent: #6c8bff;
    --accent-contrast: #10121a;
    --danger: #ff6b5e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    overflow: hidden;
  }
  .frame { display: flex; flex-direction: column; height: 100%; border: 1px solid var(--border); overflow: hidden; }
  .title-bar {
    -webkit-app-region: drag;
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 8px 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .title-bar .label { font-size: 12px; color: var(--text-muted); letter-spacing: 1px; }
  .title-bar .btns { display: flex; gap: 6px; -webkit-app-region: no-drag; }
  .icon-btn {
    width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--panel-alt); color: var(--text-muted); font-size: 13px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .icon-btn.active { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  .icon-btn:hover { color: var(--text); }
  .icon-btn.close-btn:hover { background: var(--danger); border-color: var(--danger); color: #fff; }

  .body {
    flex: 1; overflow-y: auto; padding: 16px 18px 20px;
  }
  .body::-webkit-scrollbar { width: 8px; }
  .body::-webkit-scrollbar-thumb { background: var(--panel-alt); border-radius: 4px; }
  .guide-line {
    font-size: 13px; line-height: 1.7; color: var(--text); margin-bottom: 14px;
  }
  .guide-card { border: 1px solid var(--accent); background: var(--panel); border-radius: 12px; padding: 12px 14px 2px; margin-bottom: 16px; }
  .guide-card-title { margin: 0 0 10px; font-size: 14px; font-weight: 700; color: var(--accent); }
  .guide-card .guide-line:last-child { margin-bottom: 12px; }
  .guide-copy { margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--border); text-align: center; font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="frame">
    <div class="title-bar">
      <span class="label">📖 使い方</span>
      <div class="btns">
        <div class="icon-btn" id="lockBtn" title="常に最前面に表示">🔓</div>
        <div class="icon-btn close-btn" id="closeBtn" title="閉じる">✕</div>
      </div>
    </div>
    <div class="body" id="bodyEl"></div>
  </div>

    "⏱ タイマー：押すと専用のタイマー画面が開きます。画面は1つだけで、開いている間は、タイマーのボタンが少し暗くなります（押すと「すでにタイマー画面は開いています」と表示して、その画面を前に出します）。マルチタイマーの実行中は、⏮でひとつ前のactへ、⏭で次のactへ移れます。Enterキーで開始／一時停止（メニューの中では、入力の決定）。「－」ボタンで最小化できます。スマホからタイマーのボタンを押すと、PCでタイマー画面が開き（開いている間は、スマホのタイマーのボタンも少し暗くなり、押すと「すでにタイマー画面は開いています」と出ます）、スマホとの接続が終わるときに、タイマー画面は確認なしで閉じます。Launch-0を開くときも、確認なしで閉じます。",
    "🎬 メディア：いま使っている音楽・動画アプリに、再生/一時停止・次の曲などの操作を送ります。Launch-Kのサウンドボタンの再生には作用しません。アイコンは、既定のものだけ使えます。",
    "📋 コピー：クリップボードにコピーする内容として、テキスト・画像に加えて、指定したファイルまたはフォルダそのものを選べます。ファイル／フォルダを選ぶと、押したときにそのファイル・フォルダ自体がコピーされ、Explorerなどに貼り付けると実際のファイルコピーになります（Windowsのみ対応）。「直前まで使っていた入力欄にそのまま貼り付ける」を合わせて使うと、ファイル・フォルダの場合はコピー直後にExplorerへの貼り付け（Ctrl+V相当）まで自動で行えます。",
    "📝 メモ：アプリで起動先にWindows標準の「メモ」（notepad.exe）を選ぶと、「既存のウィンドウを開く（前面に出すだけ）」「既存のウィンドウに追加（新しいタブ）」「新規のウィンドウ」を選べます。まだメモが開いていない場合は、どれを選んでも新しく起動します。",
    "🧩 マルチ操作：登録した複数の動作（マルチ操作以外）を、上から順に実行するボタンです。動作の間の待ちは状況に応じて自動で最短になり、各動作の「このあとの待ち」で0〜2秒に変えることもできます。同時には実行されません。動作は2〜15個まで登録でき、並び替えはドラッグ、削除は✕から行えます。「アプリやリンクを開く→画面分割」と続けると、開いた直後の新しいウィンドウを自動で見つけて配置します（最大7秒待ちます）。動作の欄でEnterを押しても保存されないので、続けて入力できます。",
    "🌐 リンク：URLを開く際のブラウザを、既定のほかChrome・Edgeから選べます。マルチ操作で「リンクを開く→画面分割」と続ける場合は、既存のウィンドウのタブにせず、普通のブラウザウィンドウ（タブ・アドレスバーつき）を新しく開くので、複数のウィンドウをそれぞれ別の位置に分けられます。単発でリンクだけを開くときは、これまで通り開きます。",
    "🪟 画面分割：使っていたウィンドウを、画面の左右の半分や四隅に配置するボタンです。うまく配置できないウィンドウ（管理者権限のアプリなど）は、Windows標準のキー操作（Win＋矢印）で代わりに試します。",
    "🔇 ミュートの表示：スピーカー・マイクのミュート切替ボタンは、Windowsの実際のミュート状態を読み取って表示します。もともとミュートだった場合や、キーボード・他のアプリ・Windowsの設定で切り替えた場合も、アイコンが実際の状態と合います（押した直後、画面に戻ったとき、画面が見えている間は2秒ごとに読み直します）。",
    "🎙 マイクのボタン：「マイク（すべてまとめて）」は、接続中のすべてのマイクをまとめてミュート・解除します（1台でも開いていればミュート、すべてミュート済みのときだけ解除します。仮想デバイス・ミキサー・デジタル入力は自動で対象外で、設定で個別に外すこともできます。新しく挿したマイクも自動で対象になります）。「マイク（1台ずつ）」は、選んだ1台だけを切り替えます（つながっている間だけ使えます。抜くとグレーになり、設定は残ります。同じマイクを別のボタンには選べません。ノートPCの内蔵マイクは、「内蔵マイク」と表示します（元の名前は、小さく添えます）。表示名はこのアプリの中だけで変えられ、「元の名前に戻す」で標準の名前に戻せます。「つないだ瞬間に自動でミュートする」も選べます）。一部のマイクだけが開いているときや、状態を確認できないときは、ボタンの右上に「!」が出ます。ミュートの効き方はマイクやドライバによって違うので、設定したら一度ミュートして、Windowsの入力メーターやOBSのメーターが止まることを確認してください。ミュートしたまま戻せなくなったときは、タスクトレイのアイコンの「すべてのマイクのミュートを解除」を使えます。",
    "🌓 オン/オフのアイコン：サウンドのボタンで、アイコンに画像や絵文字を使っているときは、オフ（止まっているとき）に、アイコンが少し暗くなります。マイク・スピーカーのミュート系は、画像・絵文字のアイコンのとき、オフ（ミュート中）は赤い斜線が付きます（オフ用の画像・絵文字も選べます。選ばなければ斜線です）。マイクが接続されていないときは、ボタン全体が薄くなります（PC・スマホとも）。CSSアイコンは、「オンのとき」「オフ（ミュート中）のとき」のタブでアイコンを選びます。マイク・スピーカー・ヘッドホン・イヤホンは、オン/オフ対応のアイコンで、オン用に選ぶとオフ用にも同じものが入り、オフのときは斜線（スピーカーは×）が付きます。カラーも、タブごとに選べます（オフ用を選ばなければ、赤です）。",
    "⌨️ ショートカット：コピー（Ctrl+C）・切り取り（Ctrl+X）・貼り付け（Ctrl+V）・元に戻す（Ctrl+Z）・やり直し（Ctrl+Y）・すべて選択（Ctrl+A）・保存（Ctrl+S）・検索（Ctrl+F）といった基本的なショートカットを、ボタン1つで送れます。押すと、直前まで使っていたウィンドウに対してそのキー操作を行います。自由なキーの登録はできず、用意された組み合わせから選ぶ方式です。このほか、ブラウザのタブを閉じる（Ctrl+W）と、閉じたタブを復元（Ctrl+Shift+T）も選べます。この2つは、前面のウィンドウがブラウザ（Chrome・Edge・Firefox・Brave・Vivaldi・Operaなど）のときだけ送られ、それ以外のウィンドウでは、エクスプローラーや文書が誤って閉じないよう、送らずにお知らせします。",
    "🔑 ショートカットキーの重複：起動用ショートカット（ボタンに登録して、どこからでも押せるキー）は、別の画面のボタンを含めて、同じキーを2か所に設定できません。Ctrl+Shift+Alt+K は、Launch-0を開くキーとして使われているため、ボタンには設定できません。設定のときに重複していると、どの画面のどのボタンが使っているかがお知らせされます。バックアップの読み込みで重なった起動用ショートカットは、未設定になります。",
    "⌨️ ショートカットの一覧：ハンバーガーメニュー「Windows起動時に自動起動」の下の「ショートカットの一覧」を押すと、別ウィンドウで一覧を見られます。どちらの表示も、いちばん上に「Launch-0を開く：Ctrl+Shift+Alt+K」が出ます。右上の🔓を押すと、この画面を常に最前面に表示できます（もう一度押すと解除）。「画面順」は画面1〜6ごとに、ボタン名と登録したキーを表示します（「未設定のボタンも表示」で全ボタンも確認できます）。「キー順」は数字、英字の順に、どの画面のどのボタンが使っているかを表示します。見るだけの画面で、変更はボタンの編集画面で行います。",
    "⏎ Enterキー：ボタンの追加・編集画面は、Enterで保存できます（複数行の入力欄とマルチ操作の動作欄を除く）。「適用する」などの確認画面は、そのままEnterで決定できます。削除・初期化・電源操作など取り消せない操作の確認画面は、うっかり実行しないよう、Enterを押すと「キャンセル」になります（実行するときはTabキーで赤いボタンに移ってEnter、またはクリック）。設定メニューでは、チェック項目にフォーカスがあるときのEnterで切り替え、プリセット名の入力欄でEnterを押すと保存します。",
    "🔄 更新：起動の少しあとと6時間ごとに新しいバージョンを確認し、見つかると裏でダウンロードします。ダウンロード中は、進み具合（％）が画面のゲージとタスクバーのアイコンに出ます。ダウンロードが終わると、「今すぐ再起動して更新」を選べます。選ぶとLaunch-Kを完全に終了してから、更新用インストーラーの画面が表示されます（インストールの進み具合は、そのインストーラーの画面に出ます）。表示されたら案内に沿って進めてください。更新が終わって最初に起動したときに、「更新しました」と表示します。「あとで」を選んだ場合は、Launch-Kを終了したときに更新されます。更新の経過はログに残り、うまくいかないときは、ハンバーガーメニュー最下部の「更新ログを開く」から確認できます。更新を開始できなかったときは、もとのバージョンで自動的に再起動します。",
    "📷 全画面スクショ：押すと画面全体を撮影し、ピクチャフォルダの「Launch-K Screenshots」にPNG画像として保存します。撮影中はLaunch-Kの画面は自動で隠れます。",
    "💤 スリープ：電源の「スリープ」ボタンは、休止状態ではなく、必ずスリープにします（休止状態が有効なPCでも同じです）。",
    "🖱️ 多重起動：デスクトップのアイコンを何度押しても、新しいウィンドウは増えず、すでに開いているLaunch-Kが前面に出ます（Launch-0を開いている間は、Launch-0が前面に出ます）。",
  ];
  const bodyEl = document.getElementById("bodyEl");
  // 「スマホから操作」と「Tailscaleの導入手順」は、いちばん上に、枠（カード）で囲んで表示する
  const cardsHtml = GUIDE_CARDS.map((c) => `<section class="guide-card"><h2 class="guide-card-title">${c.title}</h2>${c.lines.map((line) => `<div class="guide-line">${line}</div>`).join("")}</section>`).join("");
  bodyEl.innerHTML = cardsHtml + GUIDE_LINES.map((line) => `<div class="guide-line">${line}</div>`).join("") + `<div class="guide-copy">© kaseki</div>`;

  const lockBtn = document.getElementById("lockBtn");
  const closeBtn = document.getElementById("closeBtn");
  // メインウィンドウのロックボタンと同じ仕様：既定はオフ（🔓）、押すたびにオン/オフを切り替える。
  let locked = false;
  lockBtn.addEventListener("click", () => {
    locked = !locked;
    lockBtn.classList.toggle("active", locked);
    lockBtn.textContent = locked ? "🔒" : "🔓";
    window.guideApi.setAlwaysOnTop(locked);
  });
  closeBtn.addEventListener("click", () => window.guideApi.close());
</script>
</body>
</html>
